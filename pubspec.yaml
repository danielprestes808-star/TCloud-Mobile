name: mobile
description: "TCloud Mobile para Android."
publish_to: 'none'
version: 1.1.20+101
environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  open_filex: ^4.7.0
  shared_preferences: ^2.5.5
  mobile_scanner: ^7.4.0
  video_player: ^2.14.0
  google_mlkit_document_scanner: ^0.6.1
  google_mlkit_text_recognition: ^0.17.1
  flutter_chrome_cast: ^1.4.8

  video_player_media_kit: ^2.0.0
  media_kit_libs_android_video: ^1.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/tcloud-logo.png
